[workspace]
resolver = "3"
members = [
    "application",
    "bootloader",
    "bsp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OpenDevicePartnership/ec-slimloader"

[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]

[profile.release]
lto = true      # better optimizations
debug = 2
opt-level = "s"
