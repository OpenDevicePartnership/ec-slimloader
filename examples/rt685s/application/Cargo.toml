[package]
name = "example-application"
version = "0.1.0"
edition = "2021"

[dependencies]
example-bsp = { path = "../bsp", features = ["application"] }

ec-slimloader-state = { path = "../../../libs/ec-slimloader-state" }

cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = { version = "0.7.5" }

defmt = "0.3.6"
defmt-rtt = "0.4.0"
panic-probe = { version = "0.3.1", features = ["print-defmt"] }

embassy-imxrt = { git = "https://github.com/Wassasin/embassy-imxrt.git", branch = "tmp/ec-slimloader-deps", features = [
    "defmt",
    "time-driver",
    "time",
    "mimxrt685s",
    "unstable-pac"
] }

embassy-executor = { git = "https://github.com/embassy-rs/embassy", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }

embassy-time = { git = "https://github.com/embassy-rs/embassy", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy"}
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy" }

embassy-sync = { workspace = true }
partition-manager = { workspace = true, features = ["esa", "macros", "defmt"] }

embedded-storage = "0.3.1"
embedded-storage-async = "0.4.1"

