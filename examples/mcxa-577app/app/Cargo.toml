[package]
name = "mcxa-577app"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["set-sp", "set-vtor"] }
defmt = "1.0"
defmt-rtt = "1.0"
embassy-mcxa = { git = "https://github.com/embassy-rs/embassy", default-features = false, features = ["rt", "defmt", "mcxa5xx"] }
embassy-executor = { path = "../../../../embassy-fork/embassy-executor", default-features = false, features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { path = "../../../../embassy-fork/embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }
panic-probe = { version = "1.0", features = ["print-defmt"] }

[profile.dev]
panic = "abort"

[profile.release]
lto = false          # Disable LTO to prevent stripping debug patterns
opt-level = 2        # Standard optimization


