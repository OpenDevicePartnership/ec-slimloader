[workspace]
resolver = "2"
members = [
    "app",
    "bootloader",
]

[workspace.dependencies]
partition-manager = { git = "https://github.com/OpenDevicePartnership/embedded-services.git", tag = "v0.1.0", default-features = false }
partition-manager-macros = { git = "https://github.com/OpenDevicePartnership/embedded-services.git", tag = "v0.1.0" }
embassy-sync = "0.8.0"
embassy-mcxa = { git = "https://github.com/embassy-rs/embassy", rev = "21efdacdcdd16d7f263427d4807f64d414b03193", default-features = false }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"

[patch.crates-io]
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "21efdacdcdd16d7f263427d4807f64d414b03193" }

[profile.dev]
panic = "abort"

[profile.release]
debug = 2
lto = false
opt-level = 2
panic = "abort"
