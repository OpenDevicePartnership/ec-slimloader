# Custom probe-rs chip description for MCXA577.
#
# Identical to upstream MCXA.yaml (probe-rs/probe-rs), except the MCXA577
# variant has been extended with:
#   - PROGRAM_FLASH_SECURE  Nvm  0x10000000..0x10200000  (TrustZone secure alias)
#   - SRAM_SECURE           Ram  0x30000000..0x300A0000  (TrustZone secure alias)
# and a matching flash algorithm (mcxa5xx_2048_secure) whose address_range
# covers the secure alias so that ELFs linked at 0x10000000 are accepted.
#
# The IAP ROM on MCXA5xx accepts addresses in both the non-secure (0x0) and
# secure (0x10000000) alias spaces; the algorithm blob is unchanged.

name: MCXA
manufacturer:
  id: 0x15
  cc: 0x0
variants:
  - name: MCXA577
    cores:
      - name: main
        type: armv8m
        core_access_options: !Arm
          ap: !v1 0
    memory_map:
      - !Nvm
        name: PROGRAM_FLASH
        range:
          start: 0x0
          end: 0x200000
        cores:
          - main
        access:
          write: false
          boot: true
      - !Nvm
        name: PROGRAM_FLASH_SECURE
        range:
          start: 0x10000000
          end: 0x10200000
        cores:
          - main
        access:
          write: false
      - !Generic
        name: BootROM
        range:
          start: 0x3000000
          end: 0x3002000
        cores:
          - main
        access:
          write: false
      - !Ram
        name: SRAMX0
        range:
          start: 0x4000000
          end: 0x4008000
        cores:
          - main
      - !Ram
        name: SRAMX1
        range:
          start: 0x4008000
          end: 0x4010000
        cores:
          - main
      - !Ram
        name: SRAM
        range:
          start: 0x20000000
          end: 0x200A0000
        cores:
          - main
      - !Ram
        name: SRAM_SECURE
        range:
          start: 0x30000000
          end: 0x300A0000
        cores:
          - main
    flash_algorithms:
      - mcxa5xx_2048
      - mcxa5xx_2048_secure
flash_algorithms:
  - name: mcxa5xx_2048
    description: MCXA5XX IAP 2048kB Flash
    default: true
    instructions: 
    pc_init: 0x61
    pc_uninit: 0xc5
    pc_program_page: 0x521
    pc_erase_sector: 0x36d
    pc_erase_all: 0xc9
    pc_verify: 0x879
    data_section_offset: 0xa44
    rtt_poll_interval: 0
    flash_properties:
      address_range:
        start: 0x0
        end: 0x200000
      page_size: 0x80
      erased_byte_value: 0xff
      program_page_timeout: 300
      erase_sector_timeout: 3000
      sectors:
      - size: 0x2000
        address: 0x0
    cores:
    - main
  - name: mcxa5xx_2048_secure
    description: MCXA5XX IAP 2048kB Flash (TrustZone secure alias 0x10000000)
    default: true
    instructions: 
    pc_init: 0x61
    pc_uninit: 0xc5
    pc_program_page: 0x521
    pc_erase_sector: 0x36d
    pc_erase_all: 0xc9
    pc_verify: 0x879
    data_section_offset: 0xa44
    rtt_poll_interval: 0
    flash_properties:
      address_range:
        start: 0x10000000
        end: 0x10200000
      page_size: 0x80
      erased_byte_value: 0xff
      program_page_timeout: 300
      erase_sector_timeout: 3000
      sectors:
      - size: 0x2000
        address: 0x0
    cores:
    - main
