[package]
name = "bootloader-tool"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }

indicatif = "0.17.11"
object = { version = "0.36.7", features = ["build"] }
probe-rs = { git = "https://github.com/probe-rs/probe-rs.git", rev = "6b0c108" }

tempfile = "3.19.1"
tokio = { version = "1.47.1", features = ["macros", "rt", "rt-multi-thread"] }

anyhow = "1.0"
itertools = "0.14.0"

rand = "0.9"

serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.9", features = ["serde"] }
serde_yml = "0.0"

pretty_env_logger = "0.5"
log = "0.4"