# This is configuration file used for generation of ROT1 certificate

# ==============================================
# Issuer identification fields
# ==============================================
# All available option can be found within class NameOID in
# cryptography/src/cryptography/x509/oid.py at https://github.com/pyca/cryptography

issuer:
  COMMON_NAME: COMPANY
#  COUNTRY_NAME: CZ
#  LOCALITY_NAME: TBD
#  STATE_OR_PROVINCE_NAME: TBD
#  STREET_ADDRESS: TBD
#  ORGANIZATION_NAME: TBD

# ==============================================
# Subject identification fields
# ==============================================
# All available option can be found within class NameOID in
# cryptography/src/cryptography/x509/oid.py at https://github.com/pyca/cryptography
subject:
  COMMON_NAME: COMPANY
#  COUNTRY_NAME: CZ
#  LOCALITY_NAME: TBD
#  STATE_OR_PROVINCE_NAME: TBD
#  STREET_ADDRESS: TBD
#  ORGANIZATION_NAME: TBD
#  POSTAL_CODE: TBD

# ==============================================
# The certificate settings
# ==============================================

# Path, where issuer private key is stored
issuer_private_key: cert-rot1-ca-key.pem
# Path, where subject private key is stored (public key is retrieved from private key)
subject_public_key: cert-rot1-ca-key.pem
# Serial number of certificate
serial_number: 0x3CC30000ABABABAB
# Validity duration in days
duration: 3650

# ==============================================
# Certificate basic extensions
# ==============================================
extensions:
  BASIC_CONSTRAINTS:
    # Delegate certificate as a signing authority to create an intermediate certificates.
    ca: true
    # Integer length of the path of certificate signature from a given certificate, back to the root certificate
    path_length: 4
